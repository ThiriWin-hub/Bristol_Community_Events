<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/BCE_contact_style.css') }}">
</head>

<body>

<header>
    <div class="logo">
        <img src="{{ url_for('static', filename='images/BCE_logo.png') }}">
        <h2>Bristol Community Events</h2>
    </div>

    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('events') }}">Workshops</a>
        <a href="{{ url_for('my_bookings') }}">My Bookings</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('contact') }}">Contact</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
</header>

<main>
    <section class="page-header">
        <h1>Update Password</h1>
    </section>

    <div class="container">
        <form method="POST" action="{{ url_for('submit_update_password') }}">
            
            <label>Current Password</label>
            <input type="password" name="current_password" required>

            <label>New Password</label>
            <input type="password" name="new_password" required>

            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required>

            <input type="submit" value="Update Password">
        </form>
    </div>
</main>

<footer>
    <p> &copy; Bristol Community Event Project by Thiri Win &hearts; </p>
</footer>

</body>
</html>
