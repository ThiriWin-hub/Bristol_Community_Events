<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Admin Update Password </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/BCE_admin.css') }}">
</head>

<body>
    <header>
        <div class="logo">
            <img src="{{ url_for('static', filename='images/BCE_logo.png') }}" alt="BCE Logo">
            <h2> Bristol Community Events Admin </h2>
        </div>

        <nav>
            <a href="{{ url_for('admin') }}"> Dashboard </a>
            <a href="{{ url_for('manage_users') }}"> Manage Users </a>
            <a href="{{ url_for('manage_bookings') }}"> Manage Bookings </a>
            <a href="{{ url_for('manage_messages') }}"> Manage Messages </a>
            <a href="{{ url_for('admin_update_password') }}" class="event"> Update Password </a>
            <a href="{{ url_for('logout') }}"> Logout </a>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1> Update Admin Password </h1>
            <p> Change your admin account password securely. </p>
        </section>

        <div class="container">
            <form method="POST" action="{{ url_for('submit_admin_update_password') }}" class="admin-form">
                <label> Current Password </label>
                <input type="password" name="current_password" required>

                <label> New Password </label>
                <input type="password" name="new_password" required>

                <label> Confirm New Password </label>
                <input type="password" name="confirm_password" required>

                <input type="submit" value="Update Password">
            </form>
        </div>
    </main>

    <footer>
        <p> &copy; Bristol Community Event Project by Thiri Win &hearts; </p>
    </footer>
</body>
</html>
