<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updated</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/BCE_contact_style.css') }}">
</head>

<body>
    <header>
        <div class="logo">
            <img src="{{ url_for('static', filename='images/BCE_logo.png') }}" alt="BCE Logo">
            <h2>Bristol Community Events</h2>
        </div>

        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('events') }}">Workshops</a>
            <a href="{{ url_for('my_bookings') }}">My Bookings</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('contact') }}">Contact</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Password Updated</h1>
            <p>Your password has been changed successfully.</p>
        </section>

        <section class="contact-section">
            <div class="container">
                <h2>Success!</h2>
                <p>You can now continue using your account with your new password.</p>
                <a href="{{ url_for('home') }}" class="btn">Go to Home</a>
                <a href="{{ url_for('my_bookings') }}" class="btn">Go to My Bookings</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; Bristol Community Event Project by Thiri Win &hearts;</p>
    </footer>
</body>
</html>
