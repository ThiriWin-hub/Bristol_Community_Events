<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Login | Bristol Community Events </title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/BCE_login_style.css') }}">
    </head>

    <body>
        <header>
            <div class="logo">
                <img src="{{ url_for('static', filename='images/BCE_logo.png') }}" alt="BCE Logo">
                <h2> Bristol Community Events </h2>
            </div>

            <nav>
                <a href="{{ url_for('home') }}"> Home </a>
                <a href="{{ url_for('events') }}"> Workshops </a>
                <a href="{{ url_for('about') }}"> About </a>
                <a href="{{ url_for('contact') }}"> Contact </a>
                <a href="{{ url_for('update_password') }}"> Update Password </a>
                <a href="{{ url_for('login') }}" class="event"> Login </a>
            </nav>
        </header>

        <main>
            <section class="login-section">
                <h1> Login to Your Account </h1>
                <p> Welcome back! Please enter your details below to continue </p>

                <div class="login-container">
                    <form action="{{ url_for('submit_login') }}" method="post">
                        <label for="email"> Email </label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>

                        <label for="password"> Password </label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>

                        <div class="remember">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember"> Remember me </label>
                        </div>

                        <input type="submit" value="Login">

                        <p class="signup-link">
                            Don't have an account? <a href="{{ url_for('register') }}"> Register here </a>
                        </p>
                    </form> 
                </div>
            </section>
        </main>

        <footer>
            <p> &copy; Bristol Community Event Project by Thiri Win &hearts; </p>
        </footer>
    </body>
</html>
