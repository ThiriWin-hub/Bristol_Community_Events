<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Register </title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/BCE_contact_style.css') }}">
    </head>

    <body>
        <header>
            <div class="logo">
                <img src="{{ url_for('static', filename='images/BCE_logo.png') }}" alt="BCE Logo">
                <h2> Bristol Community Events </h2>
            </div>

            <nav>
                <a href="{{ url_for('home') }}"> Home </a>
                <a href="{{ url_for('events') }}" class="event"> Workshops </a>
                <a href="{{ url_for('about') }}"> About </a>
                <a href="{{ url_for('contact') }}"> Contact </a>
                <a href="{{ url_for('update_password') }}"> Update Password </a>
                <a href="{{ url_for('login')}}"> Login </a>
            </nav>
        </header>

        <main>
            <section class="page-header">
                <h1> Create Your Account </h1>
                <p> Register to book workshops and access free workshops. </p>
            </section>

            <section class="contact-section">
                <div class="container">
                    <form action="{{ url_for('submit_register') }}" method="post">

                        <label for="firstname"> First Name </label>
                        <input type="text" id="firstname" name="firstname" placeholder="Your first name..." required>

                        <label for="lastname"> Last Name </label>
                        <input type="text" id="lastname" name="lastname" placeholder="Your last name..." required>

                        <label for="email"> Email </label>
                        <input type="email" id="email" name="email" placeholder="Your email..." required>

                        <label for="password"> Password </label>
                        <input type="password" id="password" name="password" placeholder="Create your password..." required>

                        <input type="submit" value="Register">
                    </form>
                </div>
            </section>
        </main>

        <footer>
            <p> &copy; Bristol Community Event Project by Thiri Win &hearts; </p>
        </footer>
    </body>
</html>
