<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Payment </title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/BCE_payment_style.css') }}">
    </head>

    <body>
        <header>
            <div class="logo">
                <img src="{{ url_for('static', filename='images/BCE_logo.png') }}" alt="BCE Logo">
                <h2> Bristol Community Events </h2>
            </div>

            <nav>
                <a href="{{ url_for('home') }}"> Home </a>
                <a href="{{ url_for('events') }}"> Workshops </a>
                <a href="{{ url_for('my_bookings') }}"> My Bookings </a>
                <a href="{{ url_for('about') }}"> About </a>
                <a href="{{ url_for('contact') }}"> Contact </a>
                <a href="{{ url_for('update_password') }}"> Update Password </a>
                <a href="{{ url_for('logout') }}"> Logout </a>
            </nav>
        </header>

        <main>
            <section class="page-header">
                <h1> Payment </h1>
                <p> Please choose your payment method to complete your booking. </p>
            </section>

            <section class="contact-section">
                <div class="payment-container">
                    <form action="{{ url_for('submit_payment') }}" method="post">

                        <input type="hidden" name="booking_id" value="{{ booking.BookingID }}">

                        <label> Booking ID </label>
                        <input type="text" value="{{ booking.BookingID }}" readonly>

                        <label> Workshop </label>
                        <input type="text" value="{{ booking.EventName }}" readonly>

                        <label> Amount to Pay </label>
                        <input type="text" value="£{{ booking.FinalAmount }}" readonly>

                        <label> Payment Method </label>
                        <select name="payment_method" id="payment_method" required>
                            <option value="">-- Select Payment Method --</option>
                            <option value="credit_card">Credit Card</option>
                            <option value="paypal">PayPal</option>
                            <option value="bank_transfer">Bank Transfer</option>
                        </select>

                        <div id="credit_card_fields" class="payment-fields">
                            <label> Cardholder Name </label>
                            <input type="text" name="card_name" placeholder="Enter cardholder name">

                            <label> Card Number </label>
                            <input type="text" name="card_number" placeholder="Enter card number">

                            <label> Expiry Date </label>
                            <input type="text" name="expiry_date" id="expiry_date" placeholder="MM/YY" maxlength="5">

                            <label> CVV </label>
                            <input type="password" name="cvv" id="cvv" placeholder="Enter CVV" maxlength="4">
                        </div>

                        <div id="paypal_fields" class="payment-fields">
                            <label> PayPal Email </label>
                            <input type="email" name="paypal_email" placeholder="Enter PayPal email">
                        </div>

                        <div id="bank_transfer_fields" class="payment-fields">
                            <label> Account Holder Name </label>
                            <input type="text" name="account_name" placeholder="Enter account holder name">

                            <label> Bank Name </label>
                            <input type="text" name="bank_name" placeholder="Enter bank name">
                        </div>

                        <input type="submit" value="Pay Now">
                    
                    </form>
                </div>
            </section>
        </main>

        <footer>
            <p> &copy; Bristol Community Event Project by Thiri Win &hearts; </p>
        </footer>

        <script src="{{ url_for('static', filename='java/BCE_payment.js') }}"></script>
    </body>
</html>
